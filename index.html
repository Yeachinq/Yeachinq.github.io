<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访客统计</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-gradient: #0f172a, #1e293b;
  --card-bg: #ffffff;
  --text-color: #222222;
  --sub-text: #666666;
  --main-color: #ffcc22;
  --main-dark: #ff9900;
  --shadow: rgba(0,0,0,0.12);
}
.dark{
  --bg-gradient:#020617,#111827;
  --card-bg:#1f2937;
  --text-color:#f3f4f6;
  --sub-text:#9ca3af;
  --shadow:rgba(0,0,0,0.4);
}
body {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg, var(--bg-gradient));
  font-family:system-ui, sans-serif;
  overflow:hidden;
  transition: background 0.5s ease;
}
#canvas-bg{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  z-index:-1;
}
.box {
  text-align:center;
  background:var(--card-bg);
  padding:48px 64px;
  border-radius:20px;
  box-shadow:0 4px 20px var(--shadow);
  animation: fadeIn 0.8s ease-out;
  transition: transform 0.3s, box-shadow 0.3s, background 0.5s;
}
.box:hover{
  transform: translateY(-6px);
  box-shadow:0 10px 30px var(--shadow);
}
@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}
#tip{
  font-size:28px;
  color:var(--text-color);
}
.count-num{
  color:var(--main-dark);
  font-weight:bold;
  font-size:34px;
  display:inline-block;
}
/* 数字弹跳动画 */
@keyframes bounceNum {
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}
.num-bounce{
  animation: bounceNum 0.4s ease;
}
.sub-text{
  margin-top:18px;
  font-size:18px;
  color:var(--sub-text);
}
#busuanzi_container_site_uv{
  display:none;
  animation: textFade 0.6s ease;
}
@keyframes textFade {
  from {opacity:0;}
  to {opacity:1;}
}
.loading-text{
  font-size:24px;
  color:var(--sub-text);
}
#themeBtn{
  margin-top:24px;
  padding:10px 20px;
  background:var(--main-color);
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}
#themeBtn:hover{
  background:var(--main-dark);
  color:#fff;
}
</style>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<div class="box">
  <p class="loading-text" id="loading">加载中...</p>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  <span id="busuanzi_container_site_uv">
    <p id="tip">你是第 <span class="count-num" id="busuanzi_value_site_uv"></span> 个进入这个网站的人</p>
    <p class="sub-text">网站总访问次数：<span id="busuanzi_value_site_pv"></span></p>
  </span>
  <button id="themeBtn">切换深色/浅色模式</button>
</div>

<script>
// 粒子星空背景
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
const particles = [];
class Particle{
  constructor(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.r = Math.random()*1.5 + 0.2;
    this.speedX = (Math.random()-0.5)*0.3;
    this.speedY = (Math.random()-0.5)*0.3;
  }
  update(){
    this.x += this.speedX;
    this.y += this.speedY;
    if(this.x<0) this.x=canvas.width;
    if(this.x>canvas.width) this.x=0;
    if(this.y<0) this.y=canvas.height;
    if(this.y>canvas.height) this.y=0;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle="#ffffff";
    ctx.fill();
  }
}
for(let i=0;i<120;i++) particles.push(new Particle());
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{p.update();p.draw();})
  requestAnimationFrame(animateParticles);
}
animateParticles();

// 不蒜子加载
const checkInterval = setInterval(()=>{
  const container = document.getElementById("busuanzi_container_site_uv");
  const numEl = document.getElementById("busuanzi_value_site_uv");
  if(container.style.display !== "none"){
    clearInterval(checkInterval);
    document.getElementById("loading").style.display = "none";
    container.style.display = "block";
    numEl.classList.add("num-bounce");
  }
}, 200);

// 深色浅色切换
const themeBtn = document.getElementById('themeBtn');
themeBtn.onclick = ()=>{
  document.body.classList.toggle('dark');
}
</script>
</body>
</html>
