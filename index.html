<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访客计数器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5f7fa;
  font-family:system-ui, sans-serif;
}
.box {
  text-align:center;
  background:#fff;
  padding:40px 60px;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}
#text {
  font-size:28px;
  color:#222;
}
</style>
</head>
<body>
<div class="box">
  <p id="text"></p>
</div>
<script>
// 读取本地存储
let count = localStorage.getItem("visitorCount");
if(count === null){
  count = 1;
}else{
  count = Number(count) + 1;
}
localStorage.setItem("visitorCount", count);
document.getElementById("text").innerText = `你是第 ${count} 个进入这个网站的人`;
</script>
</body>
</html>
