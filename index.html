<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨设备点击次数统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{
    background:#f5f7fa;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.card{
    background:#fff;
    padding:40px 50px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,0.08);
    text-align:center;
}
h1{
    color:#222;
    margin-bottom:30px;
    font-size:26px;
}
.item{
    margin:20px 0;
    font-size:20px;
    color:#444;
}
.num{
    font-weight:bold;
    color:#3b82f6;
    font-size:38px;
    margin:8px 0;
}
#clickBtn{
    margin-top:24px;
    padding:16px 40px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}
#clickBtn:active{
    background:#2563eb;
}
#clickBtn:disabled{
    background:#94b8e8;
    cursor:not-allowed;
}
.tip{
    margin-top:30px;
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>
<div class="card">
    <h1>📊 点击次数统计</h1>
    <div class="item">
        全局累计点击次数
        <div class="num" id="clickCount">加载中...</div>
    </div>
    <!-- 按钮文字改为别点我 -->
    <button id="clickBtn">别点我</button>
    <p class="tip">点击【别点我】按钮增加次数<br>所有设备共用统计，关闭网页数据不会清除</p>
</div>

<script>
// 👉 修改这里！写一个独属于你的计数器名称（英文+下划线，不要中文）
const counterKey = "shandongkeji_click_2026";
const apiBase = "https://countapi.mileshilliard.com/api/v1";
const countDom = document.getElementById("clickCount");
const clickBtn = document.getElementById("clickBtn");

// 获取当前云端计数
async function getCount(){
  try{
    const res = await fetch(`${apiBase}/get/${counterKey}`);
    const json = await res.json();
    countDom.innerText = json.value || 0;
  }catch(e){
    countDom.innerText = "网络错误";
  }
}

// 按钮点击：云端数字 +1
clickBtn.onclick = async function(){
    clickBtn.disabled = true;
  try{
    const res = await fetch(`${apiBase}/hit/${counterKey}`);
    const json = await res.json();
    countDom.innerText = json.value;
  }catch(err){
    alert("API调用失败，网络问题");
  }
  clickBtn.disabled = false;
}

// 页面打开立刻读取数字
getCount();
</script>
</body>
</html>
